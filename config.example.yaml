# Process-level configuration only. Providers and model aliases live in the
# database and are managed through the admin API at /api/v1.
#
# Copy to config.yaml and adjust:
#   cp config.example.yaml config.yaml
server:
  host: 0.0.0.0
  port: 8787
  read_timeout: 30s
  write_timeout: 0s        # 0 = no write deadline, required for streaming
  shutdown_timeout: 15s
  max_body_bytes: 4194304  # 4 MiB request body cap; 0 disables it

database:
  path: data/router.db

auth:
  enabled: true
  # Static keys are optional and mainly useful for local development. Prefer
  # `zealish-router keys create --name <name>`, which stores only the hash.
  api_keys: []

# Durable per-request usage log backing the dashboard's totals and costs.
usage:
  # Delete usage events older than this many days. 0 keeps every event, which
  # grows the database without bound on a busy gateway.
  retention_days: 90

# The admin API is the dashboard's backend and can reconfigure routing, so it
# ships disabled. Enable it with a token you generate yourself — anything
# predictable here is a remote configuration hole.
#   openssl rand -hex 32
admin:
  enabled: false
  token: ""
  cors_origins:
    - http://localhost:3000
