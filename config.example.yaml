# Process-level configuration only. Providers and model aliases live in the
# database and are managed through the admin API at /api/v1.
#
# Copy to config.yaml and adjust:
#   cp config.example.yaml config.yaml
server:
  host: 0.0.0.0
  port: 8787
  read_timeout: 30s
  write_timeout: 0s        # 0 = no write deadline, required for streaming
  shutdown_timeout: 15s
  max_body_bytes: 4194304  # 4 MiB request body cap; 0 disables it

database:
  path: data/router.db

auth:
  enabled: true
  # Static keys are optional and mainly useful for local development. Prefer
  # `zealish-router keys create --name <name>`, which stores only the hash.
  api_keys: []

# Durable per-request usage log backing the dashboard's totals and costs.
usage:
  # Delete usage events older than this many days. 0 keeps every event, which
  # grows the database without bound on a busy gateway.
  retention_days: 90

# Routing engine resilience.
router:
  # The circuit breaker takes a repeatedly failing provider out of rotation so
  # a hard-down upstream is skipped instead of being retried until it times
  # out. Individual providers can override both values from the Providers page.
  breaker:
    # Consecutive retryable failures (timeout, 429, 5xx, connection error)
    # before the provider is skipped. 0 disables the breaker entirely.
    # A terminal 4xx is the caller's fault and never counts.
    failure_threshold: 5
    # How long a tripped provider is skipped before one probe request is
    # allowed through to test whether it recovered.
    cooldown: 30s
  # The background health check pings every provider's /models endpoint so a
  # dead upstream is taken out of rotation without any request paying for the
  # discovery. An unhealthy provider is skipped by the fallback chain until it
  # passes a probe again.
  health_check:
    enabled: true
    # How often every provider is pinged. 30-60s is a sensible range.
    interval: 30s
    # Deadline for a single ping.
    timeout: 5s

# Exact-match response cache. A repeated non-streaming request — same endpoint,
# same model, byte-identical body — is served from memory without touching an
# upstream, which is what makes an agent replaying the same prompt free. The
# cache is in-process and lost on restart. Streaming is never cached.
cache:
  enabled: false
  # How long a cached response may be served. This is the staleness window.
  ttl: 5m
  # Maximum number of cached responses; the least recently used one is evicted
  # past it. Large responses make this the memory knob that matters.
  max_entries: 1024

# The admin API is the dashboard's backend and can reconfigure routing, so it
# ships disabled. Enable it with a token you generate yourself — anything
# predictable here is a remote configuration hole.
#   openssl rand -hex 32
admin:
  enabled: false
  token: ""
  cors_origins:
    - http://localhost:3000

# Ponytail context optimization. Preprocesses chat completion messages to
# reduce token count before they reach the target LLM.
ponytail:
  enabled: false
  mode: balanced        # conservative | balanced | aggressive
  thresholds:
    min_input_tokens: 12000
    min_messages: 16
  protected_window: 8
  compression:
    conversation: true
    code: true
    deduplicate: true
  metadata: true
